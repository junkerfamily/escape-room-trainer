<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape Room Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Special+Elite&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">⚿</span> Escape Room Trainer</div>
    <div class="progress" aria-label="Progress">
      <div class="progress-bar"><span id="progressFill"></span></div>
      <span id="progressText">0 / 0</span>
    </div>
    <div class="stats">
      <span title="Solved with no hints">★ <b id="cleanCount">0</b></span>
      <span title="Session time">⏱ <b id="sessionTime">0:00</b></span>
      <label class="switch" title="Jump to the next puzzle after a correct answer">
        <input type="checkbox" id="autoAdvance" checked> Auto-next
      </label>
      <button class="btn ghost" id="nextUnsolved">Next unsolved ↵</button>
      <button class="btn ghost small" id="resetBtn" title="Clear progress">Reset</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <input id="search" class="search" type="search" placeholder="Search topics  ( / )" autocomplete="off">
      <nav id="nav"></nav>
      <div class="shortcuts">
        <div><kbd>↑</kbd><kbd>↓</kbd> or <kbd>J</kbd><kbd>K</kbd> move</div>
        <div><kbd>Enter</kbd> answer / next</div>
        <div><kbd>H</kbd> hint · <kbd>R</kbd> reveal · <kbd>T</kbd> try prop</div>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>

  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
